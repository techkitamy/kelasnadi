name: CI

on:
  push:
    branches: [main, stabilize-mvp, 'qa/**']
  pull_request:

jobs:
  ujian:
    name: Ujian unit, aset & logik
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ujian kandungan, aset & PWA (Python)
        run: python3 -m unittest discover -s tests -v

      - name: Semak sintaks JavaScript
        run: |
          node --check core.js
          node --check app.js
          node --check sw.js

      - name: Ujian regresi logik (Node)
        run: node --test tests/core.test.js

  e2e:
    name: E2E browser (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pasang Chromium (untuk ujian E2E)
        uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Pasang devDependencies
        run: npm install --no-audit --no-fund

      - name: E2E — chromium sebenar
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:e2e
